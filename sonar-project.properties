# Configuração do SonarQube para o projeto ms-notification-email
sonar.projectKey=11soat-hackton-videoslice_ms-notification-email
sonar.organization=11soat-hackathon-videoslice
sonar.projectName=ms-notification-email
sonar.token=${SONAR_TOKEN}
sonar.projectVersion=1.0
sonar.branch.name=master
sonar.qualitygate.wait=true

# Configurações de SCM
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Diretórios de código fonte
sonar.sources=src
sonar.tests=tests

# Diretório de exclusões
sonar.exclusions=**/__pycache__/**,**/__init__.py,**/tests/**,**/resources/**

# Linguagem
sonar.language=py
sonar.python.version=3.12

# Cobertura de testes
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/tests/**,**/__init__.py

# Encoding
sonar.sourceEncoding=UTF-8

# Métricas de qualidade
sonar.python.xunit.reportPath=test-results.xml
sonar.cpd.exclusions=**/*_interface.py

