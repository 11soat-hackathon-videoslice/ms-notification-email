[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --cov-branch
    --cov-fail-under=80
    --junit-xml=test-results.xml
markers =
    unit: marca testes unitários
    integration: marca testes de integração
    slow: marca testes que demoram mais tempo

[coverage:run]
omit =
    */tests/*
    */__init__.py
    */venv/*
    */env/*
    */exemplo_rapido_test.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
