name: Build, Test and Deploy ms-notification-email

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Pular testes e executar apenas o deploy (true/false)'
        required: false
        default: false
        type: boolean

  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/build_test_deploy_lambda.yaml'

  pull_request:
    types: [closed]
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'

env:
  FUNCTION_NAME: ${{ vars.FUNCTION_NAME }}
  PYTHON_VERSION: '3.12'
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  CORE_REPO: 11soat-hackathon-videoslice/video-slice-core

jobs:
  resolve-core-version:
    name: Obter versão do vdsc-core
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    outputs:
      core_version: ${{ steps.resolve.outputs.CORE_VERSION }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Resolver versão do vdsc-core
        id: resolve
        run: |
          # Extrair a tag informada no requirements.txt (ex: v1.0.0)
          TAG_FROM_REQ=$(grep 'vdsc-core @' src/requirements.txt | sed -E 's/.*@([^[:space:]]+)$/\1/')
          echo "📋 Tag encontrada no requirements.txt: ${TAG_FROM_REQ}"

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "master" ]; then
            # PR para master: usar a tag exata do requirements.txt
            CORE_VERSION="${TAG_FROM_REQ}"
            echo "📌 PR para master → usando tag da release: ${CORE_VERSION}"
          else
            # develop (push/workflow_dispatch): buscar último commit com pipeline bem-sucedida
            echo "📌 Branch develop → buscando último commit com pipeline bem-sucedida..."

            API_URL="https://api.github.com/repos/${{ env.CORE_REPO }}/actions/runs?branch=develop&status=success&per_page=1"
            echo "🔍 API URL: ${API_URL}"

            API_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: token ${{ secrets.VDSC_PAT }}" "${API_URL}")
            HTTP_CODE=$(echo "$API_RESPONSE" | tail -1)
            RESPONSE_BODY=$(echo "$API_RESPONSE" | sed '$d')

            echo "📡 HTTP Status: ${HTTP_CODE}"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "⚠️ API retornou status ${HTTP_CODE}, usando fallback: develop"
              echo "📋 Resposta: $(echo "$RESPONSE_BODY" | jq -r '.message // .' 2>/dev/null)"
              CORE_VERSION="develop"
            else
              TOTAL_COUNT=$(echo "$RESPONSE_BODY" | jq -r '.total_count // 0')
              echo "📊 Total de runs bem-sucedidas: ${TOTAL_COUNT}"

              SUCCESSFUL_SHA=$(echo "$RESPONSE_BODY" | jq -r '.workflow_runs[0].head_sha // empty')

              if [ -z "$SUCCESSFUL_SHA" ]; then
                echo "⚠️ Nenhum commit bem-sucedido encontrado, usando fallback: develop"
                CORE_VERSION="develop"
              else
                CORE_VERSION="${SUCCESSFUL_SHA}"
                echo "✅ Último commit bem-sucedido: ${CORE_VERSION}"
              fi
            fi
          fi

          echo "CORE_VERSION=${CORE_VERSION}" >> $GITHUB_OUTPUT

  tests-and-coverage:
    name: Testes e Quality Gate
    runs-on: ubuntu-latest
    needs: resolve-core-version
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_only == 'false') ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar requirements.txt com versão do vdsc-core
        run: |
          CORE_VERSION="${{ needs.resolve-core-version.outputs.core_version }}"
          echo "🔄 Atualizando vdsc-core para @${CORE_VERSION}"
          sed -i "s|vdsc-core @ .*|vdsc-core @ git+https://${{ secrets.VDSC_PAT }}@github.com/${{ env.CORE_REPO }}.git@${CORE_VERSION}|" src/requirements.txt
          echo "📋 requirements.txt atualizado (URL com autenticação embutida)"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Validar instalação do vdsc-core
        run: |
          python -c "import core; print(f'✅ vdsc-core importado: {core.__file__}')"

      - name: Executar testes com cobertura
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest tests/ --cov=src --cov-report=xml:coverage.xml --cov-report=html --junitxml=test-results.xml -v

      - name: Corrigir caminhos no coverage.xml
        run: |
          sed -i '/<sources>/,/<\/sources>/d' coverage.xml
          sed -i 's|filename="|filename="src/|g' coverage.xml
          sed -i 's|filename="src/src/|filename="src/|g' coverage.xml

      - name: Upload de relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            test-results.xml

      - name: Análise do SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  approval:
    name: Aprovação Manual
    runs-on: ubuntu-latest
    needs: tests-and-coverage
    if: |
      always() &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
      )
    environment:
      name: production-approval
    steps:
      - name: Aprovação Manual
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: gustavo-log,titoparizotto
          minimum-approvals: 1

  build-and-deploy:
    name: Build e Deploy na AWS
    runs-on: ubuntu-latest
    needs: [resolve-core-version, tests-and-coverage, approval]
    if: |
      always() &&
      needs.resolve-core-version.result == 'success' &&
      (needs.tests-and-coverage.result == 'success' || (needs.tests-and-coverage.result == 'skipped' && github.event.inputs.deploy_only == 'true')) &&
      (
        (github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
        ((github.ref == 'refs/heads/master' || github.event_name == 'pull_request') && needs.approval.result == 'success')
      )
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Atualizar requirements.txt com versão do vdsc-core
        run: |
          CORE_VERSION="${{ needs.resolve-core-version.outputs.core_version }}"
          echo "🔄 Atualizando vdsc-core para @${CORE_VERSION}"
          sed -i "s|vdsc-core @ .*|vdsc-core @ git+https://${{ secrets.VDSC_PAT }}@github.com/${{ env.CORE_REPO }}.git@${CORE_VERSION}|" src/requirements.txt
          echo "📋 requirements.txt atualizado (URL com autenticação embutida)"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Preparar pacote Lambda
        env:
          ZIP_NAME: ${{ env.FUNCTION_NAME }}
        run: |
          echo "📦 Preparando pacote Lambda..."
          mkdir -p lambda-package

          pip install -r src/requirements.txt -t lambda-package/ --quiet --no-cache-dir
          cp -r src/* lambda-package/

          echo "🧹 Removendo arquivos desnecessários..."
          find lambda-package -type d \( -name "__pycache__" -o -name "*.dist-info" -o -name "*.egg-info" -o -name "tests" -o -name "test" \) -exec rm -rf {} + 2>/dev/null || true
          find lambda-package -type f \( -name "*.pyc" -o -name "*.pyo" -o -name "*.md" \) -delete 2>/dev/null || true
          find lambda-package -type f -name "*.txt" ! -name "requirements.txt" -delete 2>/dev/null || true
          find lambda-package -type f -name "*.so" -exec strip {} \; 2>/dev/null || true
          rm -rf lambda-package/{pytest*,moto*,_pytest*,coverage*} 2>/dev/null || true

          cd lambda-package
          zip -r ../${ZIP_NAME}.zip . -q -9
          cd ..

          echo "📊 Tamanho do pacote: $(ls -lh ${ZIP_NAME}.zip | awk '{print $5}')"

      - name: Deploy via AWS CLI
        env:
          FUNCTION_NAME: ${{ env.FUNCTION_NAME }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%dT%H:%M:%SZ)
          S3_KEY="deploy/lambda/${FUNCTION_NAME}/${FUNCTION_NAME}-${TIMESTAMP}.zip"

          echo "⬆️ Upload do pacote para S3..."
          aws s3 cp ${FUNCTION_NAME}.zip \
            s3://${{ env.S3_BUCKET_NAME }}/${S3_KEY} \
            --region ${{ vars.AWS_REGION }} \
            --no-progress

          echo "📤 Atualizando código da função Lambda..."
          aws lambda update-function-code \
            --function-name ${FUNCTION_NAME} \
            --s3-bucket ${{ env.S3_BUCKET_NAME }} \
            --s3-key ${S3_KEY} \
            --region ${{ vars.AWS_REGION }} \
            --no-cli-pager

          echo "⏳ Aguardando conclusão da atualização..."
          aws lambda wait function-updated \
            --function-name ${FUNCTION_NAME} \
            --region ${{ vars.AWS_REGION }}

          echo "✅ Deploy concluído com sucesso às ${TIMESTAMP}"
